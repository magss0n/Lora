<div class="login-container">
  <div class="login-card">
    <img src="../../../../assets/images/logo.png" alt="logo" srcset="" class="logo">
    <h2>Welcome Back</h2>

    <form [formGroup]="loginForm" class="login-form" (ngSubmit)="onLogin($event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" formControlName="email" 
        (focus)="emailFocused=true" (blur)="emailFocused=false"/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password"  placeholder="Enter your password" formControlName="password" minlength="6"
          (focus)="passFocused=true" (blur)="passFocused=false"/>
      </div>

      <button type="submit" class="login-btn" [disabled]="loginForm.invalid" (click)="print()">
            {{ loading ? 'Signing in...' : 'Log In' }}
            @if (loading) {
            <span class="spinner"></span>
          }
      </button>
    </form>

    <p class="contact-text">
      Don’t have an account?
      <a href="mailto:lora@gmail.com">Contact Us</a>
    </p>
  </div>
</div>
