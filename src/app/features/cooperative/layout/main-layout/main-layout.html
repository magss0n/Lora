<div class="main-layout">
  <!-- Sidebar -->
  <div class="sidebar-wrapper" [class.mobile-open]="isSidebarOpen">
    <app-sidebar role="cooperative"></app-sidebar>
  </div>

  <!-- Mobile Overlay -->
  <div 
    class="mobile-overlay" 
    *ngIf="isMobile && isSidebarOpen"
    (click)="closeSidebarOnMobile()">
  </div>

  <!-- Main Content Area -->
  <div class="main-content" [class.sidebar-closed]="!isSidebarOpen">
    <!-- Header -->
    <app-header type="cooperative" (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Page Content -->
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
 
  </div>
</div>
