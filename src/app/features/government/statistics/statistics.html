<div class="statistics-page">

  <div class="page-header">
    <h2>National Agricultural Statistics</h2>
    <p>Insights on alerts, production, and regional risks</p>
  </div>


  <!-- Charts -->
  <div class="charts-grid">

    <div class="chart-card wide">
      <h4>Alerts Trend Over Time</h4>
      <canvas #alertsTrendChart></canvas>
    </div>

    <div class="chart-card">
      <h4>Alert Types Distribution</h4>
      <canvas #alertTypesChart></canvas>
    </div>

    <div class="chart-card">
      <h4>Production by Crop</h4>
      <canvas #productionChart></canvas>
    </div>

    <div class="chart-card wide">
      <h4>Regional Risk Analysis</h4>
      <canvas #regionChart></canvas>
    </div>

  </div>

</div>
